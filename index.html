<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route 508 Dispatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080c;
  --panel:#09111a;
  --line:#25303a;
  --text:#eef4f8;
  --muted:#8f9aa5;
  --blue:#155dff;
  --green:#2f9e15;
  --yellow:#f5b000;
  --red:#ff2b2b;
  --purple:#bb62ff;
}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Bebas Neue", Arial, Helvetica, sans-serif;
  font-weight:400;
  letter-spacing:0.03em;
}
button,input{font:inherit}
.page{
  min-height:100vh;
  display:grid;
  grid-template-columns:32% 44% 24%;
  grid-template-rows:auto 1fr auto;
  gap:12px;
  padding:14px;
}
.panel{
  background:linear-gradient(180deg,#07101a,#050b12);
  border:1px solid var(--line);
  border-radius:12px;
}
.left{grid-row:1 / 3;padding:16px;overflow:hidden}
.centerTop{padding:0;background:transparent;border:0}
.center{grid-row:2;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden}
.right{grid-row:1 / 3;padding:14px;display:flex;flex-direction:column;gap:14px}
.footer{
  grid-column:1 / 4;
  border-top:1px solid var(--line);
  padding:11px 4px 0;
  display:flex;
  gap:28px;
  color:#cbd3db;
  font-size:21px;
}
.routeTitle{
  font-size:44px;
  font-weight:400;
  letter-spacing:.02em;
  margin-bottom:14px;
}
.routeTitle span{color:#ffd21f}
.metrics{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:18px;
}
.metric{
  padding:10px 4px;
  text-align:center;
  border-right:1px solid var(--line);
}
.metric:last-child{border-right:0}
.metric .label{font-size:16px;font-weight:400;white-space:nowrap}
.metric .num{font-size:28px;font-weight:400;margin-top:6px}
.c-blue{color:#2f7cff}.c-green{color:#42c52c}.c-yellow{color:var(--yellow)}
.c-red{color:var(--red)}.c-purple{color:var(--purple)}.c-gray{color:#c1c7ce}
.sectionTitle{
  margin:16px 0 8px;
  font-size:25px;
  font-weight:400;
}
.sectionTitle.blue{color:#2672ff}
.sectionTitle.green{color:#47bd26}
.busTable{border-top:1px solid var(--line)}
.busRow{
  display:grid;
  grid-template-columns:64px 1fr 120px;
  align-items:center;
  gap:10px;
  min-height:47px;
  border-bottom:1px solid #17222d;
  cursor:pointer;
}
.busRow:hover{background:#0c1722}
.busNo{
  width:50px;
  padding:8px 0;
  border-radius:6px;
  text-align:center;
  font-weight:400;
  color:white;
}
.busNo.blue{background:var(--blue)}
.busNo.green{background:var(--green)}
.driver{font-size:18px}
.status{font-size:16px;text-align:right;font-weight:400}
.breakBox{
  margin-top:18px;
  border:1px solid #6e5712;
  border-radius:10px;
  overflow:hidden;
}
.breakTitle{
  padding:10px 12px;
  font-weight:400;
  color:var(--yellow);
  border-bottom:1px solid #5b4913;
}
.breakRow{
  display:grid;
  grid-template-columns:60px 1fr 110px;
  gap:10px;
  padding:9px 12px;
  border-bottom:1px solid #292411;
  font-size:16px;
}
.searchWrap{padding:0 0 0 0}
.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #7b8289;
  background:#0b0b0b;
  color:white;
  font-size:22px;
  text-transform:uppercase;
  outline:none;
}
.routeDiagram{
  flex:1;
  overflow:hidden;
  min-height:430px;
  padding:28px 30px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
}
.direction{
  position:relative;
  height:150px;
}
.directionLabel{
  font-size:30px;
  font-weight:400;
  margin-bottom:30px;
}
.directionLabel.blue{color:#2870ff}
.directionLabel.green{color:#45c828}
.track{
  position:absolute;
  left:4%;
  right:4%;
  top:90px;
  height:8px;
  border-radius:99px;
}
.track.blue{background:#245fff}
.track.green{background:#3aa51d}
.terminal{
  position:absolute;
  top:67px;
  width:48px;height:48px;
  border-radius:50%;
  background:#080b10;
  border:4px solid;
  display:grid;place-items:center;
  font-size:28px;font-weight:400;
  z-index:2;
}
.terminal.left{left:0}
.terminal.right{right:0}
.terminal.blue{border-color:#285fff}
.terminal.green{border-color:#3aa51d}
.marker{
  position:absolute;
  top:46px;
  transform:translateX(-50%);
  min-width:62px;
  padding:11px 10px;
  color:white;
  border-radius:6px;
  text-align:center;
  font-weight:400;
  font-size:24px;
  z-index:3;
  border:2px solid transparent;
}
.marker.blue{background:var(--blue)}
.marker.green{background:var(--green)}
.marker.alert{
  border-color:var(--red);
  box-shadow:0 0 18px rgba(255,43,43,.8);
}
.marker .accident{
  position:absolute;
  left:50%;
  bottom:48px;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:31px solid var(--red);
}
.marker .accident:after{
  content:"!";
  position:absolute;
  color:white;
  font-size:24px;
  font-weight:400;
  left:-4px;
  top:7px;
}
.headwayBox{padding:14px 16px}
.headwayTitle{font-weight:400;font-size:25px;margin-bottom:14px}
.headwayLine{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:nowrap;
  margin:10px 0;
}
.hwBus{
  min-width:48px;
  padding:8px 10px;
  border-radius:6px;
  text-align:center;
  font-weight:400;
}
.hwBus.blue{background:var(--blue)}
.hwBus.green{background:var(--green)}
.hwGap{color:#dbe2e8;min-width:44px;text-align:center}
.hwGap.bad{color:var(--red);font-weight:400}
.timeBox{text-align:center;padding:12px}
.date{font-size:18px}
.clock{font-size:42px;font-weight:400;margin-top:3px}
.shiftBox{text-align:center;padding:14px}
.shiftName{font-size:30px;font-weight:400;color:#2672ff}
.shiftTime{font-size:22px;margin:8px 0}
.progress{color:#36c525;font-weight:400}
.alerts{display:flex;flex-direction:column;min-height:0;flex:1}
.alertsTitle{font-size:28px;font-weight:400;margin-bottom:8px}
.alertList{overflow-y:auto;overflow-x:hidden;padding-right:5px;scrollbar-width:none}
.alertList::-webkit-scrollbar{display:none}
.alertCard{
  border:1px solid;
  border-left-width:5px;
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
  background:#0d0e12;
}
.alertCard.red{border-color:#d93434}
.alertCard.yellow{border-color:#d2a400}
.alertCard.purple{border-color:#8a46c5}
.alertTop{display:flex;justify-content:space-between;gap:8px;font-weight:400}
.alertType{margin:10px 0;font-size:21px;font-weight:400}
.alertMeta{font-size:16px;line-height:1.7;color:#c7cdd3}
.systemOk{color:#2ccc28}.gpsOk{color:#45d22f}
.dim{color:var(--muted)}
.selected{outline:2px solid white;outline-offset:-2px}
@media(max-width:1100px){
  .page{
    grid-template-columns:31% 45% 24%;
    gap:7px;
    padding:7px;
    min-width:0;
  }
  .left{padding:9px}
  .right{padding:8px;gap:8px;min-width:0}
  .center{padding:8px;gap:8px}
  .routeTitle{font-size:34px;margin-bottom:9px}
  .metrics{margin-bottom:10px}
  .metric{padding:7px 2px}
  .metric .label{font-size:11px}
  .metric .num{font-size:22px}
  .sectionTitle{font-size:20px;margin:10px 0 6px}
  .busRow{grid-template-columns:48px minmax(0,1fr) 84px;gap:5px;min-height:36px}
  .busNo{width:40px;padding:6px 0}
  .driver{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:12px;white-space:nowrap}
  .search{padding:12px 14px;font-size:18px}
  .routeDiagram{min-height:340px;padding:20px 18px}
  .direction{height:125px}
  .directionLabel{font-size:24px;margin-bottom:20px}
  .track{top:76px}
  .terminal{top:56px;width:42px;height:42px;font-size:18px}
  .marker{top:38px;min-width:58px;padding:10px 8px;font-size:20px}
  .marker .accident{bottom:43px}
  .headwayBox{padding:10px}
  .headwayTitle{font-size:20px;margin-bottom:8px}
  .headwayLine{gap:5px;margin:7px 0;white-space:nowrap}
  .hwBus{min-width:39px;padding:6px 7px}
  .hwGap{min-width:42px;font-size:14px}
  .date{font-size:18px}
  .clock{font-size:34px}
  .shiftName{font-size:24px}
  .shiftTime{font-size:18px}
  .alertsTitle{font-size:23px}
  .alertCard{padding:9px}
  .alertType{font-size:18px}
  .alertMeta{font-size:14px}
  .footer{font-size:14px;gap:16px;padding-top:7px}
}
strong,b{font-weight:400}
</style>
</head>
<body>
<div class="page">
  <aside class="left panel">
    <div class="routeTitle">ROUTE <span>508</span></div>
    <div class="metrics">
      <div class="metric"><div class="label c-blue">ON ROUTE</div><div class="num" id="mOnRoute">0</div></div>
      <div class="metric"><div class="label c-gray">DEPOT</div><div class="num" id="mDepot">0</div></div>
      <div class="metric"><div class="label c-yellow">REPAIR</div><div class="num" id="mRepair">0</div></div>
      <div class="metric"><div class="label c-purple">GPS OFF</div><div class="num" id="mGps">0</div></div>
      <div class="metric"><div class="label c-red">ALERT</div><div class="num" id="mAlert">0</div></div>
      <div class="metric"><div class="label c-yellow">ON BREAK</div><div class="num" id="mBreak">0</div></div>
    </div>

    <div class="sectionTitle blue">A → B / 5 BUSES</div>
    <div class="busTable" id="listAB"></div>

    <div class="sectionTitle green">B → A / 5 BUSES</div>
    <div class="busTable" id="listBA"></div>

    <div class="breakBox">
      <div class="breakTitle">ON BREAK / LUNCH</div>
      <div id="breakRows"></div>
    </div>
  </aside>

  <div class="centerTop searchWrap">
    <input class="search" id="search" placeholder="SEARCH BUS OR DRIVER">
  </div>

  <main class="center panel">
    <div class="routeDiagram">
      <div class="direction">
        <div class="directionLabel blue">A → B</div>
        <div class="track blue"></div>
<div id="trackAB"></div>
      </div>

      <div class="direction">
        <div class="directionLabel green">B → A</div>
        <div class="track green"></div>
<div id="trackBA"></div>
      </div>
    </div>

    <div class="headwayBox panel">
      <div class="headwayTitle">HEADWAY (MINUTES)</div>
      <div class="headwayLine" id="headwayAB"></div>
      <div class="headwayLine" id="headwayBA"></div>
    </div>
  </main>

  <aside class="right">
    <div class="timeBox panel">
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="shiftBox panel">
      <div class="shiftName">SHIFT A</div>
      <div class="shiftTime">08:00 – 20:00</div>
      <div class="progress">IN PROGRESS</div>
    </div>
    <div class="alerts panel">
      <div class="alertsTitle">ALERTS</div>
      <div class="alertList" id="alertList"></div>
    </div>
  </aside>

  <footer class="footer">
    <div>SYSTEM STATUS: <span class="systemOk">ONLINE</span></div>
    <div>GPS CONNECTION: <span class="gpsOk">98%</span></div>
  </footer>
</div>

<script>
const buses = [
 {no:'01',driver:'ANAR ALIYEV',dir:'AB',status:'ON ROUTE',pos:12},
 {no:'02',driver:'ALI MAMEDOV',dir:'AB',status:'LONG STOP',pos:31},
 {no:'03',driver:'ARZU ABBASOV',dir:'AB',status:'ON ROUTE',pos:50},
 {no:'04',driver:'MAMED ISMAYLOV',dir:'AB',status:'ACCIDENTAL STOP',pos:70},
 {no:'05',driver:'OMER MIRALIYEV',dir:'AB',status:'ON BREAK',pos:88,break:'13:30 – 14:00'},
 {no:'06',driver:'RASHAD NOVRUZOV',dir:'BA',status:'ON BREAK',pos:12,break:'14:00 – 14:30'},
 {no:'07',driver:'ELNUR HUSEYNOV',dir:'BA',status:'GPS OFF',pos:31},
 {no:'08',driver:'AZAD ALIYEV',dir:'BA',status:'ON ROUTE',pos:50},
 {no:'09',driver:'MAHMUD ALIYEV',dir:'BA',status:'ON ROUTE',pos:69},
 {no:'10',driver:'KANAN ALIYEV',dir:'BA',status:'ON ROUTE',pos:88}
];

const alerts = [
 {bus:'04',type:'ACCIDENTAL STOP',driver:'MAMED ISMAYLOV',start:'17:35',duration:'25 MIN',tone:'red'},
 {bus:'02',type:'LONG STOP',driver:'ALI MAMEDOV',start:'17:50',duration:'15 MIN',tone:'yellow'},
 {bus:'07',type:'GPS OFF',driver:'ELNUR HUSEYNOV',start:'17:55',duration:'',tone:'purple',lastSeen:'17:55'}
];

const hwAB = [
 ['01','8'],['02','7'],['03','15'],['04','8'],['05',null]
];
const hwBA = [
 ['06','10'],['07','9'],['08','10'],['09','10'],['10',null]
];

function statusClass(status){
  if(status==='ON ROUTE') return 'c-green';
  if(status==='ON BREAK'||status==='LONG STOP') return 'c-yellow';
  if(status==='GPS OFF') return 'c-purple';
  if(status==='ACCIDENTAL STOP') return 'c-red';
  return 'c-gray';
}
function renderList(dir,id){
  document.getElementById(id).innerHTML=buses.filter(b=>b.dir===dir).map(b=>`
    <div class="busRow" data-bus="${b.no}">
      <div class="busNo ${dir==='AB'?'blue':'green'}">${b.no}</div>
      <div class="driver">${b.driver}</div>
      <div class="status ${statusClass(b.status)}">${b.status}</div>
    </div>`).join('');
}
function renderTrack(dir,id){
  document.getElementById(id).innerHTML=buses.filter(b=>b.dir===dir).map(b=>`
    <div class="marker ${dir==='AB'?'blue':'green'} ${b.status==='ACCIDENTAL STOP'?'alert':''}" style="left:${b.pos}%" data-bus="${b.no}">
      ${b.status==='ACCIDENTAL STOP'?'<span class="accident"></span>':''}
      ${b.no}
    </div>`).join('');
}
function renderHeadway(dir,id,data){
  const c=dir==='AB'?'blue':'green';
  const label=dir==='AB'?'A → B':'B → A';
  document.getElementById(id).innerHTML =
    `<strong class="${dir==='AB'?'c-blue':'c-green'}">${label}</strong>` +
    data.map(([bus,gap],i)=>{
      const bad=gap && (+gap<4 || +gap>13);
      return `<span class="hwBus ${c}" data-bus="${bus}">${bus}</span>${gap?`<span class="hwGap ${bad?'bad':''}">${gap} MIN</span>`:''}`;
    }).join('');
}
function renderBreaks(){
  document.getElementById('breakRows').innerHTML=buses.filter(b=>b.status==='ON BREAK').map(b=>`
    <div class="breakRow"><strong>BUS ${b.no}</strong><span>${b.driver}</span><span>${b.break||'—'}</span></div>`).join('');
}
function renderAlerts(){
  const sorted=[...alerts].sort((a,b)=>a.start.localeCompare(b.start));
  document.getElementById('alertList').innerHTML=sorted.map((a,i)=>`
    <div class="alertCard ${a.tone}">
      <div class="alertTop"><span>${i+1} &nbsp; BUS <span class="${a.tone==='red'?'c-red':a.tone==='purple'?'c-purple':'c-yellow'}">${a.bus}</span></span><span>ACTIVE</span></div>
      <div class="alertType ${a.tone==='red'?'c-red':a.tone==='purple'?'c-purple':'c-yellow'}">${a.type}</div>
      <div class="alertMeta">
        DRIVER: ${a.driver}<br>
        START: ${a.start}<br>
        ${a.duration?`DURATION: ${a.duration}<br>`:''}
        ${a.lastSeen?`LAST SEEN: ${a.lastSeen}`:''}
      </div>
    </div>`).join('');
}
function renderMetrics(){
  const count=s=>buses.filter(b=>b.status===s).length;
  document.getElementById('mOnRoute').textContent=count('ON ROUTE');
  document.getElementById('mDepot').textContent=count('DEPOT');
  document.getElementById('mRepair').textContent=count('REPAIR');
  document.getElementById('mGps').textContent=count('GPS OFF');
  document.getElementById('mAlert').textContent=count('ACCIDENTAL STOP');
  document.getElementById('mBreak').textContent=count('ON BREAK');
}
function selectBus(no){
  document.querySelectorAll('[data-bus]').forEach(el=>el.classList.toggle('selected',el.dataset.bus===no));
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-bus]');
  if(el)selectBus(el.dataset.bus);
});
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toUpperCase();
  document.querySelectorAll('.busRow').forEach(row=>{
    const b=buses.find(x=>x.no===row.dataset.bus);
    row.style.display=!q||b.no.includes(q)||b.driver.includes(q)?'grid':'none';
  });
  const hit=buses.find(b=>b.no.includes(q)||b.driver.includes(q));
  if(q && hit)selectBus(hit.no);
});
function tick(){
  const d=new Date();
  document.getElementById('date').textContent=d.toLocaleDateString('en-GB');
  document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour12:false});
}
renderList('AB','listAB');
renderList('BA','listBA');
renderTrack('AB','trackAB');
renderTrack('BA','trackBA');
renderHeadway('AB','headwayAB',hwAB);
renderHeadway('BA','headwayBA',hwBA);
renderBreaks();
renderAlerts();
renderMetrics();
tick(); setInterval(tick,1000);
</script>
</body>
</html>
